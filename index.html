<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDKGATE — TERMINAL</title>
  <meta name="description" content="SDK FRACTAL GATE — Codex, Signals, Terminal." />
  <style>
    :root{
      --bg: #000000;
      --fg: #33ff00;       /* Vert phosphore standard */
      --fg-dim: #1a8000;   /* Vert éteint pour les éléments passifs */
      --accent: #33ff00;   /* Pas d'autre couleur. Juste du vert. */
      --scanline: rgba(0,255,0,0.05);
      --glass: rgba(51, 255, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow-x: hidden; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: "Courier New", Courier, "Lucida Sans Typewriter", monospace; /* La base du rétro */
      font-weight: bold;
      -webkit-font-smoothing: none; /* On veut du pixel, pas du lissage */
    }

    /* Effet CRT / Scanlines global */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 999;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Effet Vignette écran bombé */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,1) 100%);
      z-index: 998;
      pointer-events: none;
    }

    .shell {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .brand {
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg);
      text-shadow: 0 0 5px var(--fg); /* Petit effet néon */
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--fg-dim);
      padding-bottom: 5px;
      width: 100%;
      text-align: center;
      max-width: 600px;
    }

    /* Le Board (Grille) */
    .board-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 20px 0;
    }

    .board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px; /* Plus large pour l'effet terminal */
      background: transparent; /* Pas de fond, juste le noir */
    }

    /* Les Cellules (Caractères) */
    .cell {
      position: relative;
      width: 16px;  /* Taille fixe type grille terminal */
      height: 24px;
      margin: 0;    /* Pas de marge, c'est une grille */
      background: var(--bg);
      color: var(--fg);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      overflow: hidden;
      /* Pas de bordures arrondies. C'est du brut. */
    }

    .cell-inner {
      display: block;
      /* On garde la rotation pour le "flakflok", mais ça fera un effet glitch */
      transform-origin: 50% 50%;
      transition: transform 0.05s steps(2); /* Mouvement saccadé mécanique */
    }

    .cell.flip .cell-inner {
      transform: rotateX(90deg);
      opacity: 0.5;
    }

    /* Formulaire & Newsletter */
    .newsletter {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      text-align: center;
      border: 1px solid var(--fg-dim);
      padding: 15px;
      background: rgba(0, 20, 0, 0.4);
    }

    .newsletter-title {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--fg);
      font-weight: bold;
      text-shadow: 0 0 2px var(--fg);
    }

    .bd-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* Inputs style terminal */
    .bd-input {
      background: #000;
      border: 1px solid var(--fg);
      color: var(--fg);
      font-family: inherit;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      box-shadow: none;
      border-radius: 0;
    }
    .bd-input::placeholder { color: var(--fg-dim); opacity: 1; }
    .bd-input:focus {
      background: var(--fg);
      color: var(--bg); /* Inversion au focus */
    }

    .bd-button {
      background: var(--bg);
      border: 1px solid var(--fg);
      color: var(--fg);
      padding: 10px;
      font-family: inherit;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s;
      border-radius: 0;
    }
    .bd-button:hover {
      background: var(--fg);
      color: var(--bg);
      box-shadow: 0 0 10px var(--fg);
    }
    .bd-button:active { transform: translateY(2px); }

    .bd-powered {
      font-size: 0.7rem;
      color: var(--fg-dim);
      margin-top: 5px;
    }
    .bd-powered a { color: var(--fg-dim); text-decoration: none; border-bottom: 1px dotted var(--fg-dim); }

    /* Liens footer */
    .links {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-top: 20px;
      border-top: 1px solid var(--fg-dim);
      padding-top: 15px;
    }

    .links a {
      color: var(--fg-dim);
      text-decoration: none;
      position: relative;
    }
    .links a:hover {
      color: var(--fg);
      text-shadow: 0 0 5px var(--fg);
    }
    .links a::before {
      content: "> ";
      opacity: 0;
    }
    .links a:hover::before { opacity: 1; }

    /* Curseur clignotant décoratif à la fin du titre */
    .brand span::after {
      content: "_";
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <span>SYSTEM.ROOT.SDK_GATE</span>
    </header>

    <div class="board-wrap">
      <div id="board" class="board" aria-live="polite"></div>
    </div>

    <section class="newsletter">
      <div class="newsletter-title">// TRANSMISSION PROTOCOL</div>
      <div style="font-size: 0.8rem; color: var(--fg-dim); margin-bottom: 10px;">
        > AWAITING INPUT FOR CODEX SIGNAL...
      </div>

      <form
        action="https://buttondown.com/api/emails/embed-subscribe/sdkcodx"
        method="post"
        class="bd-form"
        target="_blank"
      >
        <label for="bd-email" class="visually-hidden">Email</label>
        <input
          type="email"
          name="email"
          id="bd-email"
          required
          class="bd-input"
          placeholder="USER@NET.WORK"
        />
        <input type="submit" value="[ EXECUTE ]" class="bd-button" />
        <p class="bd-powered">
          SYS_OP: <a href="https://buttondown.com/sdkcodx" target="_blank">BUTTONDOWN</a>
        </p>
      </form>
    </section>

    <nav class="links">
      <a href="https://linktr.ee/sdkcodx">PORTALS</a>
      <a href="https://open.spotify.com/intl-fr/artist/3oRPIbf8vPiZ9WgaHrxXzU">SPOTIFY</a>
      <a href="https://instagram.com/sdkcodx">INSTAGRAM</a>
      <a href="https://youtube.com/@sdkcodx">YOUTUBE</a>
    </nav>
  </div>

<script>
/* ===========
   PHRASES CODEX (Format Brut)
   =========== */
const PHRASES = [
  "I. THE UNREACHABLE COMFORTS MORE THAN THE TRUTH.",
  "II. THE GROUND DOES NOT EXIST. IT RISES UNDER STEPS.",
  "III. LOGIC IS ELASTIC.",
  "IV. WHAT YOU ERASE, BURY UNDER GREATNESS.",
  "V. THE CHAOS OFFERED ME SILENCE.",
  "VI. THE NON-ACTION RELIEVES.",
  "VII. WHAT YOU DO NOT BURN, YOU DISTILL.",
  "VIII. THE MASK CRACKS WHERE LIGHT ENTERS.",
  "IX. THE FLOOR IS AN AGREEMENT BETWEEN FEAR AND HABIT.",
  "X. WHAT IS SEEN IS LESS REAL THAN WHAT IS FELT.",
  "SYSTEM_ERROR: REALITY_CHECK_FAILED",
  "UPLOADING_CONSCIOUSNESS... 99%"
];

// Alphabet Terminal (Simplifié pour le look code)
const CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?/\\-_<>[]{}*#&@%";

const boardEl = document.getElementById("board");

function createCells(count){
  boardEl.innerHTML = "";
  for(let i=0;i<count;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    const inner = document.createElement("span");
    inner.className = "cell-inner";
    inner.textContent = " "; // Init vide
    cell.appendChild(inner);
    boardEl.appendChild(cell);
  }
}

function animateToPhrase(phrase){
  phrase = phrase.trim();
  const chars = phrase.split("");
  createCells(chars.length);

  const cells = Array.from(boardEl.querySelectorAll(".cell"));
  
  const tasks = cells.map((cell, i)=>{
    const inner = cell.firstChild;
    const target = chars[i] || " ";
    
    // Si c'est un espace ou pas dans le charset, on set direct
    if(!CHARSET.includes(target.toUpperCase()) && target !== " "){
      inner.textContent = target;
      return Promise.resolve();
    }
    
    return new Promise(resolve=>{
      const targetUp = target.toUpperCase();
      let idx = Math.floor(Math.random()*CHARSET.length);
      let flips = 0;
      // Vitesse plus rapide pour effet "calculateur"
      const maxFlips = 10 + Math.floor(Math.random()*10); 

      function step(){
        const ch = CHARSET[idx];
        inner.textContent = ch;
        
        // Ajout classe flip pour petit saut visuel
        cell.classList.add("flip");
        setTimeout(()=>cell.classList.remove("flip"), 30);

        if((ch === targetUp && flips > 4) || flips > maxFlips){
          inner.textContent = target; // Fix final
          // Parfois on laisse un "glitch" de couleur (facultatif, restons simple)
          return resolve();
        }
        
        idx = (idx + 1) % CHARSET.length;
        flips++;
        // Timing très rapide
        setTimeout(step, 20 + Math.random()*20);
      }
      
      // Délai en cascade pour effet de vague gauche->droite
      setTimeout(step, i * 10); 
    });
  });

  return Promise.all(tasks);
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function loopPhrases(){
  let lastIndex = -1;
  while(true){
    let idx;
    do{ idx = Math.floor(Math.random()*PHRASES.length); }
    while(PHRASES.length>1 && idx === lastIndex);
    lastIndex = idx;

    await animateToPhrase(PHRASES[idx]);
    await sleep(4000);
  }
}

loopPhrases();
</script>
</body>
</html>
