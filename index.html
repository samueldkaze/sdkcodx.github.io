<!DOCTYPE html>
<html lang="fr" data-rite="splitflap">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDKGATE — Samuel D Kaze</title>
  <meta name="description" content="SDK FRACTAL GATE — Codex, Signals, Splitflap." />
  <style>
    :root{
      --bg:#020306;
      --fg:#f0f3f8;
      --muted:#9098ac;
      --accent:#a58cff;
      --cell-bg:#060910;
      --cell-border:#151822;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:radial-gradient(circle at 20% 0%, #1a1630 0, #020306 55%);
      color:var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell{
      min-height:100vh;
      padding:16px 10px 20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:.8rem;
      letter-spacing:.25em;
      text-transform:uppercase;
      color:var(--muted);
      opacity:.85;
      text-align:center;
    }

    .brand span{
      color:var(--accent);
    }

    .board-wrap{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
    }

    .board{
      display:inline-flex;
      flex-wrap:wrap;
      justify-content:center;
      max-width: min(38ch, 94vw);
      background:linear-gradient(180deg,#05060c,#03040a);
      border-radius:14px;
      padding:10px 8px 12px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.8),
        0 18px 60px rgba(0,0,0,.85);
      position:relative;
      overflow:hidden;
    }

    .board::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%,transparent 60%,rgba(0,0,0,.7));
      mix-blend-mode:soft-light;
      pointer-events:none;
    }

    .cell{
      position:relative;
      width:1.1em;
      height:1.6em;
      margin:1px;
      border-radius:3px;
      background:var(--cell-bg);
      border:1px solid var(--cell-border);
      color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:clamp(1.05rem, 4.5vw, 1.35rem);
      display:flex;
      align-items:center;
      justify-content:center;
      text-transform:uppercase;
      overflow:hidden;
    }

    .cell-inner{
      display:block;
      transform-origin:50% 50%;
      transition:transform 0.08s linear;
    }

    .cell.flip .cell-inner{
      transform:rotateX(90deg);
    }

    .newsletter{
      width:100%;
      max-width:420px;
      margin:12px auto 6px;
      text-align:center;
      color:var(--muted);
      font-size:.8rem;
    }

    .newsletter-title{
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:6px;
      color:var(--fg);
      opacity:.85;
      font-size:.78rem;
    }

    .bd-form{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:stretch;
      margin-top:6px;
    }

    .visually-hidden{
      position:absolute;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    .bd-input{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(165,140,255,.45);
      background:rgba(3,4,10,.9);
      color:var(--fg);
      font-size:.9rem;
      outline:none;
    }
    .bd-input::placeholder{color:var(--muted);opacity:.7;}
    .bd-input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(165,140,255,.7);
    }

    .bd-button{
      padding:9px 12px;
      border-radius:999px;
      border:1px solid rgba(165,140,255,.85);
      background:var(--accent);
      color:#05040b;
      font-weight:600;
      font-size:.85rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      cursor:pointer;
    }
    .bd-button:active{transform:translateY(1px);}

    .bd-powered{
      font-size:.7rem;
      opacity:.6;
      margin-top:2px;
    }
    .bd-powered a{
      color:var(--muted);
      text-decoration:none;
    }
    .bd-powered a:hover{text-decoration:underline;}

    .links{
      width:100%;
      max-width:520px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:.78rem;
      text-transform:uppercase;
      opacity:.9;
      padding-top:6px;
      border-top:1px solid rgba(255,255,255,.04);
    }
    .links a{
      color:var(--muted);
      text-decoration:none;
      letter-spacing:.14em;
    }
    .links a:hover{
      color:var(--accent);
    }

    @media (max-width:480px){
      .shell{padding-top:10px;padding-bottom:16px;}
      .board{padding:8px 6px 10px;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <span>SDK</span> FRACTAL GATE
    </header>

    <div class="board-wrap">
      <div id="board" class="board" aria-live="polite" aria-label="Codex messages"></div>
    </div>

    <section class="newsletter">
      <div class="newsletter-title">SECRET CODEX ACCESS</div>
      <div>Rare transmissions. No spam. One click to leave.</div>

      <!-- Buttondown embed, restylé -->
      <form
        action="https://buttondown.com/api/emails/embed-subscribe/sdkcodx"
        method="post"
        class="embeddable-buttondown-form bd-form"
        target="_blank"
      >
        <label for="bd-email" class="visually-hidden">Enter your email</label>
        <input
          type="email"
          name="email"
          id="bd-email"
          required
          class="bd-input"
          placeholder="you@example.com"
        />
        <input type="submit" value="RECEIVE SIGNALS" class="bd-button" />
        <p class="bd-powered">
          Powered by
          <a href="https://buttondown.com/sdkcodx" target="_blank" rel="noopener">Buttondown</a>.
        </p>
      </form>
    </section>

    <nav class="links">
      <a href="https://linktr.ee/sdkcodx" target="_blank" rel="noopener">PORTALS</a>
      <a href="https://open.spotify.com/intl-fr/artist/3oRPIbf8vPiZ9WgaHrxXzU" target="_blank" rel="noopener">SPOTIFY</a>
      <a href="https://instagram.com/sdkcodx" target="_blank" rel="noopener">INSTAGRAM</a>
      <a href="https://facebook.com/sdkcodx" target="_blank" rel="noopener">FACEBOOK</a>
      <a href="https://youtube.com/@sdkcodx" target="_blank" rel="noopener">YOUTUBE</a>
      <a href="https://tiktok.com/@sdkcodx" target="_blank" rel="noopener">TIKTOK</a>
    </nav>
  </div>

<script>
/* ===========
   PHRASES CODEX
   =========== */
const PHRASES = [
  "I. ☉ THE UNREACHABLE COMFORTS MORE THAN THE TRUTH.",
  "II. ∞ THE GROUND DOES NOT EXIST. IT RISES UNDER STEPS.",
  "III. † LOGIC IS ELASTIC.",
  "IV. ⌘ WHAT YOU ERASE, BURY UNDER GREATNESS, NOT SILENCE.",
  "V. ☍ THE CHAOS OFFERED ME SILENCE. I SCREAMED MY NAME INSIDE.",
  "VI. ∴ THE NON-ACTION RELIEVES. IT IS NOT A LACK, BUT A RETURN TO THE CENTER.",
  "VII. ⊕ WHAT YOU DO NOT BURN, YOU DISTILL. DESIRE DOES NOT DIE, IT THICKENS.",
  "VIII. ↯ THE MASK CRACKS WHERE THE LIGHT DESIRES TO ENTER.",
  "IX. ☌ THE FLOOR IS NOT SOLID. IT IS AN AGREEMENT BETWEEN FEAR AND HABIT.",
  "X. ⚚ WHAT IS SEEN IS LESS REAL THAN WHAT IS FELT.",
  "XI. ∞ TO POSSESS IS TO BE POSSESSED.",
  "XII. ⌖ THE CROWD BELIEVES IN WHAT IT CANNOT TOUCH.",
  "XIII. ✦ THE STRONGEST TRUTH IS THE ONE NO ONE CAN REMEMBER.",
  "XIV. ☍ EVERY NAME IS A CAGE.",
  "XV. ✠ WHAT YOU IGNORE BECOMES YOUR SHADOW.",
  "XVI. ∴ TO DOMINATE, ONE MUST FIRST WITHDRAW.",
  "XVII. ☉ EVERY IDOL IS AN EMPTY STONE UNTIL THE CROWD BLEEDS ON IT.",
  "XVIII. ↯ THE ECHO LASTS LONGER THAN THE VOICE.",
  "XIX. ⌘ THE STRONGEST WEAPON IS THE ONE YOU DO NOT SHOW.",
  "XX. ☌ THE INVISIBLE IS MORE TERRIFYING THAN THE KNOWN.",
  "XXI. ✠ WHAT RISES FAST IS ALREADY FALLING.",
  "XXII. ☉ EVERY GAZE DEMANDS A SACRIFICE.",
  "XXIII. ∞ WHAT YOU CREATE CONTAINS WHAT YOU ARE. WHAT YOU ARE CONTAINS WHAT YOU CREATE.",
  "XXIV. ⊕ THE CROWD NEEDS BLOOD TO BELIEVE IN JUSTICE.",
  "XXV. ☍ THE SKY IS A MIRROR. IT NEVER ANSWERS, ONLY REFLECTS.",
  "XXVI. ↯ THE GODS DIE WHEN YOU STOP FEARING THEM.",
  "XXVII. ∴ WHAT YOU CANNOT BREAK, CONFUSE.",
  "XXVIII. ✦ TO SPEAK LESS IS TO BE HEARD MORE.",
  "XXIX. ⚚ EVERY GIFT IS A CHAIN IN DISGUISE.",
  "XXX. ⌘ THE SILENCE IS NEVER EMPTY. IT IS FULL OF KNIVES."
];

// Alphabet pour le split-flap
const CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?/\\\\-_☉∞†⌘∴⊕↯☍☌✦✠⚚";

/* ===========
   BOARD SETUP
   =========== */
const boardEl = document.getElementById("board");

function createCells(count){
  boardEl.innerHTML = "";
  for(let i=0;i<count;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    const inner = document.createElement("span");
    inner.className = "cell-inner";
    inner.textContent = " ";
    cell.appendChild(inner);
    boardEl.appendChild(cell);
  }
}

function animateToPhrase(phrase){
  phrase = phrase.trim();
  if(phrase.length > 64) phrase = phrase.slice(0,64); // limite pour mobile
  const chars = phrase.split("");
  createCells(chars.length);

  const cells = Array.from(boardEl.querySelectorAll(".cell"));
  const promises = cells.map((cell, i)=>{
    const inner = cell.firstChild;
    const target = chars[i] || " ";
    if(!CHARSET.includes(target.toUpperCase()) && target !== " "){
      // pas dans le charset : on affiche direct
      inner.textContent = target;
      return Promise.resolve();
    }
    return new Promise(resolve=>{
      const targetUp = target.toUpperCase();
      let idx = Math.floor(Math.random()*CHARSET.length);
      let flips = 0;
      const maxFlips = 18 + Math.floor(Math.random()*10);

      function step(){
        const ch = CHARSET[idx];
        inner.textContent = ch;
        cell.classList.add("flip");
        setTimeout(()=>cell.classList.remove("flip"), 55);

        if((ch === targetUp && flips > 6) || flips > maxFlips){
          inner.textContent = target;
          return resolve();
        }
        idx = (idx + 1) % CHARSET.length;
        flips++;
        setTimeout(step, 32 + Math.random()*30);
      }
      // décalage pour l'effet vague
      setTimeout(step, i*18);
    });
  });

  return Promise.all(promises);
}

async function loopPhrases(){
  let i = 0;
  while(true){
    const phrase = PHRASES[i % PHRASES.length];
    await animateToPhrase(phrase);
    // pause de lecture
    await new Promise(r=>setTimeout(r, 4500));
    i++;
  }
}

loopPhrases();
</script>
</body>
</html>
