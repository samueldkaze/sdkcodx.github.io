<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAMUEL D. KAZE — SDKCODX</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #555555;
      --line: #222222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.4;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 60px 20px;
      text-align: center;
    }

    header {
      margin-bottom: 60px;
    }

    h1 {
      font-size: clamp(1.5rem, 8vw, 2.5rem);
      margin: 0 0 20px 0;
      letter-spacing: 0.2em;
      line-height: 1;
    }

    .slogan {
      font-size: 0.75rem;
      border: 1px solid var(--line);
      display: inline-block;
      padding: 8px 16px;
      color: var(--muted);
    }

    .cta-section {
      margin-bottom: 80px;
    }

    .btn {
      display: block;
      border: 1px solid var(--fg);
      padding: 22px;
      color: var(--bg);
      background: var(--fg);
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background: var(--bg);
      color: var(--fg);
    }

    .signals {
      border-top: 1px solid var(--line);
      padding-top: 60px;
      margin-bottom: 60px;
    }

    .signals h2 {
      font-size: 1rem;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 15px;
      font-family: 'Courier New', Courier, monospace;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      border-radius: 0;
    }

    input:focus {
      border-color: var(--fg);
    }

    input[type="submit"] {
      border: 1px solid var(--fg);
      cursor: pointer;
      background: transparent;
      transition: all 0.1s;
    }

    input[type="submit"]:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .info-block {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.8;
    }

    nav.links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 30px;
    }

    nav.links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.7rem;
    }

    nav.links a:hover {
      color: var(--fg);
    }

    html, body { overflow-x: hidden; }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>SAMUEL D. KAZE</h1>
      <div class="slogan">I TRANSMIT. YOU DECODE.</div>
    </header>

    <section class="cta-section">
      <a class="btn" href="https://linktr.ee/sdkcodx" target="_blank" rel="noopener">ENTER PORTALS</a>
    </section>

    <section class="signals">
      <h2>SIGNALS</h2>
      <form action="https://buttondown.com/api/emails/embed-subscribe/sdkcodx" method="post" target="_blank">
        <input type="email" name="email" placeholder="EMAIL_SOURCE" required />
        <input type="submit" value="SUBSCRIBE" />
      </form>
    </section>

    <section class="info-block">
      <p>
        PRODUCER & LIVE PERFORMER<br/>
        FORMERLY NOISEBUILDER<br/>
        FRANCE / GLOBAL
      </p>
    </section>

    <nav class="links">
      <a href="https://instagram.com/sdkcodx" target="_blank">INSTAGRAM</a>
      <a href="https://youtube.com/@sdkcodx" target="_blank">YOUTUBE</a>
      <a href="https://tiktok.com/@sdkcodx" target="_blank">TIKTOK</a>
      <a href="https://facebook.com/sdkcodx" target="_blank">FACEBOOK</a>
    </nav>
  </div>
</body>
</html>
